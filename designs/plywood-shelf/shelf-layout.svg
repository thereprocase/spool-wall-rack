<text x="740" y="145" class="sub">DETAILS</text>
<text x="740" y="181" class="label">32 mm wide closed triangle</text>
<text x="740" y="210" class="label">6 mm high outside locating lip</text>
<text x="740" y="239" class="label">Open top accepts varying plywood thickness</text>
<text x="740" y="283" class="label">Stud axes: 24 / 75 / 125 mm below shelf</text>
<text x="740" y="312" class="label">6.5 mm nominal shank clearance</text>
<text x="740" y="341" class="label">18.5 mm recessed driver access</text>
<text x="740" y="370" class="label">8 mm backed washer lands</text>
<text x="740" y="414" class="label">Install brackets before placing plywood.</text>
<text x="740" y="443" class="label">Upper screw needs a long driver extension.</text>
<text x="740" y="487" class="label">First trial uses whole-body 100% modifiers.</text>
<text x="740" y="516" class="small">Closed shape is not a verified load rating.</text>
<text x="55" y="586" class="sub">FRONT ELEVATION · 32-INCH STUD-SPACING EXAMPLE</text>
